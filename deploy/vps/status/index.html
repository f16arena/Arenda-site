<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloud-001 — состояние</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1 15 14H1z' fill='%23ededed'/></svg>">
<style>
:root{
  --bg:#0a0a0a;--panel:#111;--panel2:#161616;--line:#262626;--line2:#333;
  --fg:#ededed;--mut:#8f8f8f;--mut2:#5c5c5c;
  --ok:#2fbf71;--warn:#f5a524;--bad:#f0444b;--run:#3b8cff;--chart:#ededed;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --bg:#fafafa;--panel:#fff;--panel2:#f4f4f4;--line:#e6e6e6;--line2:#d4d4d4;
  --fg:#111;--mut:#666;--mut2:#a0a0a0;--chart:#111;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#fafafa;--panel:#fff;--panel2:#f4f4f4;--line:#e6e6e6;--line2:#d4d4d4;
    --fg:#111;--mut:#666;--mut2:#a0a0a0;--chart:#111;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;height:56px;padding-bottom:0}
.logo{width:18px;height:18px}
h1{font-size:15px;font-weight:600;margin:0}
.sep{color:var(--mut2)}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:p 2s infinite}
.pulse.stale{background:var(--bad);animation:none}
@keyframes p{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:var(--panel2)}
h2{font-size:13px;font-weight:500;color:var(--mut);margin:28px 0 12px;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 8px;min-width:0}
.tile .k{color:var(--mut);font-size:12px}
.tile .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 0;white-space:nowrap}
.tile .s{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--line);margin:8px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
svg.spark{display:block;width:100%;height:34px;margin-top:6px}
.meta{color:var(--mut);font-size:12px;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 16px}
.proj{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;padding:16px 18px;flex-wrap:wrap}
.ph h3{margin:0;font-size:16px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.run{color:var(--run)}.mut{color:var(--mut)}
.bg-ok{background:var(--ok)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}.bg-run{background:var(--run)}.bg-mut{background:var(--mut2)}
.st{font-size:13px;color:var(--mut)}
.links{margin-left:auto;display:flex;gap:12px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.pb{display:grid;grid-template-columns:1.2fr 1fr;border-top:1px solid var(--line)}
@media (max-width:820px){.pb{grid-template-columns:1fr}}
.cell{padding:14px 18px;min-width:0}
.cell+.cell{border-left:1px solid var(--line)}
@media (max-width:820px){.cell+.cell{border-left:0;border-top:1px solid var(--line)}}
.lbl{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dep{display:flex;gap:10px;align-items:flex-start;min-width:0}
.badge{font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.sha{font-family:var(--mono);font-size:12px;color:var(--mut)}
.subj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hist{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.hist li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;padding:5px 0;border-top:1px solid var(--line);align-items:baseline}
.hist li .subj{color:var(--fg)}
.hist .when{color:var(--mut);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;min-width:0}
.chk .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chk .ms{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px}
.upt{display:flex;gap:1px;height:16px;align-items:stretch;width:120px;flex:none}
.upt i{flex:1;border-radius:1px;background:var(--ok);opacity:.85}
.upt i.x{background:var(--bad);opacity:1}.upt i.n{background:var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--mut);font-size:12px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.tw{overflow-x:auto;border-top:1px solid var(--line)}
.tw table{min-width:640px}
.r{text-align:right}
.mini{display:inline-block;width:46px;height:4px;background:var(--line);border-radius:2px;vertical-align:middle;margin-left:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--fg)}
.lnk{color:var(--mut);cursor:pointer;font-size:12px;background:none;border:0;padding:0}
.lnk:hover{color:var(--fg);text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
details>summary{cursor:pointer;color:var(--mut);font-size:12px;list-style:none;padding:10px 18px;border-top:1px solid var(--line)}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"▸ ";}
details[open]>summary:before{content:"▾ ";}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;padding:24px 16px}
.modal.on{display:flex}
.mbox{margin:auto;width:min(1100px,100%);height:min(86vh,900px);background:var(--panel);border:1px solid var(--line2);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mh b{font-family:var(--mono);font-size:13px;font-weight:500}
.mh .sp{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12px}
pre{margin:0;flex:1;overflow:auto;padding:12px 14px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;background:var(--bg)}
input[type=search]{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line2);border-radius:6px;padding:3px 8px;width:180px}
.err{background:color-mix(in srgb,var(--bad) 14%,var(--panel));border:1px solid var(--bad);border-radius:10px;padding:10px 14px;margin-top:16px;display:none}
.empty{color:var(--mut2);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap">
  <svg class="logo" viewBox="0 0 16 16"><path d="M8 1 15 14H1z" fill="currentColor"/></svg>
  <h1 id="host">cloud-001</h1><span class="sep">/</span><span class="st" id="sub">состояние сервера</span>
  <div class="live"><span class="pulse" id="pulse"></span><span id="upd">подключение…</span>
    <button id="theme" title="Тема">◐</button></div>
</div></header>

<div class="wrap">
  <div class="err" id="err"></div>
  <h2>Сервер</h2>
  <div class="grid" id="tiles"></div>
  <div class="meta" id="smeta"></div>

  <h2>Проекты</h2>
  <div id="projects"></div>
</div>

<div class="modal" id="modal"><div class="mbox">
  <div class="mh"><b id="mtitle"></b>
    <div class="sp">
      <input type="search" id="mfilter" placeholder="фильтр…">
      <label><input type="checkbox" id="mauto" checked> обновлять</label>
      <button id="mtop">↓ в конец</button><button id="mclose">Закрыть</button>
    </div></div>
  <pre id="mpre"></pre>
</div></div>

<script>
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
const gb = (b) => (b / 1024 ** 3).toFixed(b >= 10 * 1024 ** 3 ? 0 : 1) + " ГБ"
const mb = (b) => b >= 1024 ** 3 ? gb(b) : Math.round(b / 1024 ** 2) + " МБ"
const rate = (b) => b >= 1024 ** 2 ? (b / 1024 ** 2).toFixed(1) + " МБ/с" : Math.round(b / 1024) + " КБ/с"
const pct = (a, b) => (b ? (100 * a) / b : 0)
function ago(t, now) {
  const s = Math.max(0, now - t)
  if (s < 60) return s + " с назад"
  if (s < 3600) return Math.floor(s / 60) + " мин назад"
  if (s < 86400) return Math.floor(s / 3600) + " ч " + Math.floor((s % 3600) / 60) + " мин назад"
  return Math.floor(s / 86400) + " дн назад"
}
const dur = (s) => (s == null ? "" : s < 60 ? s + " с" : Math.floor(s / 60) + " мин " + (s % 60) + " с")
const clock = (t) => new Date(t * 1000).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
const level = (p, w = 75, b = 90) => (p >= b ? "bad" : p >= w ? "warn" : "")

function spark(vals, max) {
  if (vals.length < 2) return '<svg class="spark"></svg>'
  const W = 200, H = 34, m = max || Math.max(...vals, 1)
  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * W, H - 2 - (Math.min(v, m) / m) * (H - 4)])
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("")
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d}L${W} ${H}L0 ${H}Z" fill="var(--chart)" opacity=".08"/>
    <path d="${d}" fill="none" stroke="var(--chart)" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`
}

function tile(k, v, s, p, series, max) {
  const bar = p == null ? "" : `<div class="bar"><i class="${level(p)}" style="width:${Math.min(p, 100).toFixed(1)}%"></i></div>`
  return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div>${bar}${series ? spark(series, max) : ""}</div>`
}

function renderServer(sv, now) {
  const h = sv.history, last = h[h.length - 1] || {}
  const cpu = last.cpu ?? 0
  const memP = pct(sv.mem_used, sv.mem_total), swP = pct(sv.swap_used, sv.swap_total), dP = pct(sv.disk_used, sv.disk_total)
  $("#host").textContent = sv.host
  $("#tiles").innerHTML = [
    tile("Процессор", cpu.toFixed(0) + "%", `${sv.ncpu} ядра · за час макс ${Math.max(0, ...h.map((x) => x.cpu)).toFixed(0)}%`, cpu, h.map((x) => x.cpu), 100),
    tile("Нагрузка (load)", sv.load[0].toFixed(2), `5 мин ${sv.load[1].toFixed(2)} · 15 мин ${sv.load[2].toFixed(2)}`, pct(sv.load[0], sv.ncpu), h.map((x) => x.load), Math.max(sv.ncpu, ...h.map((x) => x.load))),
    tile("Память", gb(sv.mem_used), `из ${gb(sv.mem_total)} · свободно ${gb(sv.mem_total - sv.mem_used)}`, memP, h.map((x) => x.mem), sv.mem_total),
    tile("Swap", gb(sv.swap_used), `из ${gb(sv.swap_total)}`, swP, h.map((x) => x.swap), sv.swap_total),
    tile("Диск", gb(sv.disk_used), `из ${gb(sv.disk_total)} · ${dP.toFixed(0)}%`, dP),
    tile("Сеть", "↓ " + rate(last.rx || 0), "↑ " + rate(last.tx || 0), null, h.map((x) => x.rx + x.tx)),
    tile("Диск I/O", "R " + rate(last.rd || 0), "W " + rate(last.wr || 0), null, h.map((x) => x.rd + x.wr)),
  ].join("")
  const up = sv.uptime
  $("#smeta").innerHTML = `<span>Работает без перезагрузки: ${Math.floor(up / 86400)} дн ${Math.floor((up % 86400) / 3600)} ч</span>
    <span>Графики — последний час</span>${sv.reboot_required ? '<span class="warn">Нужна перезагрузка после обновлений</span>' : ""}`
}

const DEP = {
  ok: ["Готово", "ok", "✓"], failed: ["Ошибка", "bad", "✕"], rollback: ["Откат", "bad", "↺"],
  running: ["Сборка…", "run", "●"], unknown: ["Оборвался", "warn", "?"],
}

function shaLink(p, d) {
  const sha = (d.sha || "").split("-")[0].slice(0, 7)
  if (!sha) return ""
  return p.repo ? `<a class="sha" href="${p.repo}/commit/${d.sha_full || sha}" target="_blank" rel="noopener">${sha}</a>` : `<span class="sha">${sha}</span>`
}

function projectStatus(p, now) {
  const issues = []
  let lv = "ok"
  const bump = (l, why) => { issues.push([l, why]); if (l === "bad" || (l === "warn" && lv === "ok") || (l === "run" && lv === "ok")) lv = l }
  for (const c of p.checks) if (!(c.code > 0 && c.code < 500)) bump("bad", "сайт не отвечает: " + c.url.replace("https://", ""))
  for (const c of p.containers) {
    if (c.state !== "running") bump(c.state === "exited" ? "bad" : "warn", `${c.name}: ${c.state}`)
    else if (c.health === "unhealthy") bump("bad", c.name + ": unhealthy")
    else if (c.health === "starting") bump("warn", c.name + ": запускается")
  }
  for (const u of p.units || []) if (u.state !== "active") bump("bad", `служба ${u.name}: ${u.state}`)
  const d = p.deploys[0]
  if (d?.status === "running") bump("run", "идёт деплой")
  else if (d && d.status !== "ok") bump("warn", "последний деплой не прошёл — работает прежняя версия")
  if (p.backup && now - p.backup.time > 26 * 3600) bump("warn", "бэкап старше суток")
  return { lv, issues }
}

function uptimeBar(hist) {
  const n = 30, cells = hist.slice(-n)
  const pad = Array(Math.max(0, n - cells.length)).fill('<i class="n"></i>')
  return `<span class="upt" title="последние ${n} проверок (каждые 30 с)">${pad.join("")}${cells.map((h) => `<i class="${h.ok ? "" : "x"}" title="${clock(h.t)} ${h.ms ?? "—"} мс"></i>`).join("")}</span>`
}

function renderProject(p, now) {
  const { lv, issues } = projectStatus(p, now)
  const head = issues.length ? issues.map(([l, w]) => `<span class="${l}">${esc(w)}</span>`).join(" · ") : '<span class="ok">Всё работает</span>'
  const d = p.deploys[0]
  let dep = '<div class="empty">Деплоев в журнале нет</div>'
  if (d) {
    const [t, cls, ic] = DEP[d.status]
    const when = d.status === "running" ? `идёт ${dur(now - d.start)}` : `${ago(d.end || d.start, now)}${d.duration ? " · " + dur(d.duration) : ""}`
    dep = `<div class="dep"><span class="badge ${cls}">${ic} ${t}</span>
      <div style="min-width:0;flex:1"><div class="subj">${shaLink(p, d)} ${esc(d.subject || "")}</div>
      <div class="st">${when}${d.inferred ? " · по времени запуска контейнера" : ""}</div>
      ${d.error ? `<div class="bad" style="font-size:12px">${esc(d.error)}</div>` : ""}</div></div>`
  }
  const hist = p.deploys.slice(1, 10).map((x) => {
    const [t, cls, ic] = DEP[x.status]
    return `<li><span class="${cls}" title="${t}">${ic}</span><span class="subj">${shaLink(p, x)} ${esc(x.subject || "")}</span>
      <span class="when">${clock(x.start)}${x.duration ? " · " + dur(x.duration) : ""}</span></li>`
  }).join("")
  const checks = p.checks.map((c) => {
    const ok = c.code > 0 && c.code < 500
    return `<div class="chk"><span class="dot ${ok ? "bg-ok" : "bg-bad"}"></span>
      <a class="u" href="${c.url}" target="_blank" rel="noopener">${esc(c.url.replace("https://", ""))}</a>
      <span class="ms">${c.code || esc(c.error || "нет ответа")}${c.ms != null ? " · " + c.ms + " мс" : ""}</span>${uptimeBar(c.history)}</div>`
  }).join("")
  const units = (p.units || []).map((u) => `<span class="badge ${u.state === "active" ? "ok" : "bad"}">${esc(u.name)}</span>`).join("")
  const bk = p.backup ? `<div class="chk"><span class="dot ${now - p.backup.time > 26 * 3600 ? "bg-warn" : "bg-ok"}"></span>
      <span class="u">Бэкап: ${ago(p.backup.time, now)} · ${mb(p.backup.size)}</span><span class="ms">хранится ${p.backup.count}</span></div>` : ""
  const logs = (p.logs || []).map((l) => `<button class="lnk" data-proj="${p.id}" data-log="${l}">${l}</button>`).join(" · ")
  const rows = p.containers.map((c) => {
    const st = c.state !== "running" ? ["bad", c.state] : c.health === "unhealthy" ? ["bad", "unhealthy"] : c.health === "starting" ? ["warn", "запуск"] : ["ok", c.health || "работает"]
    const mp = c.mem_limit ? pct(c.mem, c.mem_limit) : 0
    return `<tr><td><span class="dot bg-${st[0]}" style="display:inline-block;margin-right:8px"></span>${st[1]}</td>
      <td class="n" title="${esc(c.image)}">${esc(c.name)}</td>
      <td class="r">${c.cpu == null ? "—" : c.cpu.toFixed(1) + "%"}</td>
      <td class="r">${c.mem ? mb(c.mem) : "—"}${c.mem_limit && c.mem_limit < 15 * 1024 ** 3 ? ` / ${mb(c.mem_limit)}<span class="mini"><i class="${level(mp)}" style="width:${mp}%"></i></span>` : ""}</td>
      <td class="mut">${esc(c.status.replace(/\s*\(.*\)/, ""))}</td>
      <td class="r"><button class="lnk" data-container="${esc(c.name)}">логи</button></td></tr>`
  }).join("")
  const links = (p.links || []).map((l) => `<a href="${l}" target="_blank" rel="noopener">${esc(l.replace("https://", ""))}</a>`).join("")
    + (p.repo ? `<a href="${p.repo}/commits/main" target="_blank" rel="noopener">GitHub</a>` : "")
  const open = openDetails.has(p.id) ? " open" : ""
  return `<section class="proj" id="p-${p.id}">
    <div class="ph"><span class="dot bg-${lv}"></span><h3>${esc(p.name)}</h3><span class="st">${head}</span><div class="links">${links}</div></div>
    <div class="pb">
      <div class="cell"><div class="lbl">Последний деплой${p.deploy_how ? ` <span class="mut">· ${esc(p.deploy_how)}</span>` : ""}</div>${dep}
        ${hist ? `<ul class="hist">${hist}</ul>` : ""}</div>
      <div class="cell"><div class="lbl">Доступность</div>${checks || ""}${units ? `<div class="chips" style="margin:6px 0">${units}</div>` : ""}${bk}
        ${!checks && !units && !bk ? '<div class="empty">Нет проверок</div>' : ""}
        ${logs ? `<div class="lbl" style="margin:12px 0 0">Журналы: ${logs}</div>` : ""}</div>
    </div>
    <details data-id="${p.id}"${open}><summary>Контейнеры: ${p.containers.length}, работает ${p.containers.filter((c) => c.state === "running").length}</summary>
      <div class="tw"><table><thead><tr><th>Состояние</th><th>Имя</th><th class="r">CPU</th><th class="r">Память</th><th>Запущен</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">нет</td></tr>'}</tbody></table></div></details>
  </section>`
}

const openDetails = new Set(JSON.parse(safeGet("open") || '["commrent","orda","jiyn","shared"]'))
function safeGet(k) { try { return localStorage.getItem("st:" + k) } catch { return null } }
function safeSet(k, v) { try { localStorage.setItem("st:" + k, v) } catch {} }
document.addEventListener("toggle", (e) => {
  const id = e.target?.dataset?.id
  if (!id) return
  e.target.open ? openDetails.add(id) : openDetails.delete(id)
  safeSet("open", JSON.stringify([...openDetails]))
}, true)

let lastOk = 0
async function tick() {
  try {
    const r = await fetch("api/state", { cache: "no-store" })
    if (!r.ok) throw new Error("HTTP " + r.status)
    const s = await r.json()
    renderServer(s.server, s.now)
    $("#projects").innerHTML = s.projects.map((p) => renderProject(p, s.now)).join("")
    const bad = s.projects.filter((p) => projectStatus(p, s.now).lv === "bad").length
    document.title = (bad ? `(${bad}) ` : "") + s.server.host + " — состояние"
    lastOk = Date.now()
    $("#err").style.display = "none"
  } catch (e) {
    $("#err").style.display = "block"
    $("#err").textContent = "Нет связи с сервером: " + e.message
  }
  const stale = Date.now() - lastOk > 20000
  $("#pulse").classList.toggle("stale", stale)
  $("#upd").textContent = lastOk ? (stale ? "нет данных с " : "обновлено ") + new Date(lastOk).toLocaleTimeString("ru-RU") : "подключение…"
}
tick()
setInterval(tick, 5000)

// ── Просмотр журналов ──
let logSrc = null, logTimer = null, rawLog = ""
function showLog() {
  const f = $("#mfilter").value.toLowerCase()
  const pre = $("#mpre"), atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30
  pre.textContent = f ? rawLog.split("\n").filter((l) => l.toLowerCase().includes(f)).join("\n") : rawLog
  if (atEnd) pre.scrollTop = pre.scrollHeight
}
async function loadLog() {
  try { rawLog = await (await fetch("api/logs?" + logSrc + "&tail=800", { cache: "no-store" })).text() } catch (e) { rawLog = "Ошибка: " + e.message }
  showLog()
}
function openLog(src, title) {
  logSrc = src; rawLog = ""
  $("#mtitle").textContent = title; $("#mpre").textContent = "загрузка…"; $("#modal").classList.add("on")
  loadLog().then(() => ($("#mpre").scrollTop = $("#mpre").scrollHeight))
  clearInterval(logTimer); logTimer = setInterval(() => $("#mauto").checked && loadLog(), 4000)
}
function closeLog() { $("#modal").classList.remove("on"); clearInterval(logTimer) }
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-container],button[data-log]")
  if (b?.dataset.container) openLog("container=" + encodeURIComponent(b.dataset.container), "docker logs " + b.dataset.container)
  else if (b?.dataset.log) openLog(`project=${b.dataset.proj}&log=${b.dataset.log}`, `${b.dataset.proj} / ${b.dataset.log}`)
})
$("#mclose").onclick = closeLog
$("#modal").onclick = (e) => e.target.id === "modal" && closeLog()
document.addEventListener("keydown", (e) => e.key === "Escape" && closeLog())
$("#mfilter").oninput = showLog
$("#mtop").onclick = () => ($("#mpre").scrollTop = $("#mpre").scrollHeight)

// ── Тема ──
const applyTheme = (t) => (t ? document.documentElement.setAttribute("data-theme", t) : document.documentElement.removeAttribute("data-theme"))
applyTheme(safeGet("theme"))
$("#theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches
  const cur = document.documentElement.getAttribute("data-theme") || (dark ? "dark" : "light")
  const next = cur === "dark" ? "light" : "dark"
  applyTheme(next); safeSet("theme", next)
}
</script>
</body>
