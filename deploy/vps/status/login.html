<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход — панель сервера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="https://commrent.kz/icon.png">
<style>
/* Цвета и формы — как на commrent.kz/login (slate + blue-600, Manrope, радиус 10px). */
:root{
  --bg:#f8fafc;--card:#fff;--fg:#0f172a;--fg2:#334155;--mut:#64748b;--line:#e2e8f0;
  --primary:#2563eb;--primary-h:#1d4ed8;--ring:rgba(59,130,246,.22);
  --err-bg:#fef2f2;--err-line:#fecaca;--err:#b91c1c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(700px 380px at 50% -80px,rgba(37,99,235,.10),transparent 70%),
             radial-gradient(500px 300px at 100% 100%,rgba(99,102,241,.07),transparent 70%)}
.box{width:100%;max-width:420px;position:relative}
.logo{display:block;text-align:center;margin-bottom:28px;text-decoration:none}
.logo img{height:56px;width:auto}
.logo p{margin:12px 0 0;color:var(--mut);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;color:var(--primary);background:#eff6ff;border:1px solid #dbeafe;border-radius:99px;padding:3px 10px}
.badge svg{width:13px;height:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -10px rgba(15,23,42,.08)}
label{display:block;font-size:14px;font-weight:600;color:var(--fg2);margin-bottom:6px}
.field{margin-bottom:16px;position:relative}
input[type=text],input[type=password]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;color:var(--fg);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#94a3b8}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px var(--ring)}
.pw{position:relative}
.pw input{padding-right:44px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:none;border-radius:8px;color:#94a3b8;cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--fg2);background:#f1f5f9}
.eye svg{width:18px;height:18px}
.row{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 18px;font-size:13px;color:var(--mut)}
.row label{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--mut);margin:0;cursor:pointer;font-size:13px}
.row input{width:16px;height:16px;accent-color:var(--primary);margin:0}
.btn{width:100%;height:44px;border:0;border-radius:10px;background:var(--primary);color:#fff;font:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .05s}
.btn:hover{background:var(--primary-h)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.7;cursor:default}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;display:none}
.btn[disabled] .spin{display:block}
@keyframes s{to{transform:rotate(360deg)}}
.err{display:none;gap:8px;align-items:flex-start;background:var(--err-bg);border:1px solid var(--err-line);color:var(--err);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:16px}
.err.on{display:flex}
.err svg{width:16px;height:16px;flex:none;margin-top:2px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px;display:flex;justify-content:center;gap:6px;align-items:center}
.foot svg{width:13px;height:13px}
</style>
</head>
<body>
<div class="box">
  <a class="logo" href="https://commrent.kz" aria-label="Commrent.kz">
    <img src="https://commrent.kz/commrent-logo-navbar.png" alt="Commrent.kz" width="160" height="56">
    <p>Панель состояния сервера</p>
    <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>cloud-001</span>
  </a>

  <form class="card" id="f" autocomplete="on" novalidate>
    <div class="err" id="err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.5"/></svg><span id="errt"></span></div>
    <div class="field">
      <label for="login">Логин</label>
      <input type="text" id="login" name="username" autocomplete="username" placeholder="admin" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <div class="pw">
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
        <button type="button" class="eye" id="eye" aria-label="Показать пароль" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <div class="row"><label><input type="checkbox" id="remember" checked> Запомнить на 30 дней</label></div>
    <button class="btn" id="btn" type="submit"><span class="spin"></span><span id="bt">Войти</span></button>
  </form>
  <div class="foot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Только для владельца · после 5 ошибок вход блокируется на 15 минут</div>
</div>
<script>
const $ = (s) => document.querySelector(s)
try { const u = localStorage.getItem("st:login"); if (u) { $("#login").value = u; $("#password").focus() } else $("#login").focus() } catch { $("#login").focus() }
$("#eye").onclick = () => { const p = $("#password"); p.type = p.type === "password" ? "text" : "password"; p.focus() }
function fail(msg) {
  $("#errt").textContent = msg; $("#err").classList.add("on")
  const f = $("#f"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake")
}
$("#f").onsubmit = async (e) => {
  e.preventDefault()
  const login = $("#login").value.trim(), password = $("#password").value
  if (!login || !password) return fail("Введите логин и пароль")
  $("#btn").disabled = true; $("#bt").textContent = "Входим…"; $("#err").classList.remove("on")
  try {
    const r = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ login, password, remember: $("#remember").checked }) })
    if (r.ok) { try { localStorage.setItem("st:login", login) } catch {} ; location.replace("/"); return }
    const j = await r.json().catch(() => ({}))
    fail(j.error || "Ошибка входа (" + r.status + ")")
    $("#password").select()
  } catch (err) { fail("Нет связи с сервером") }
  $("#btn").disabled = false; $("#bt").textContent = "Войти"
}
</script>
</body>
</html>
